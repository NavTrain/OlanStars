<!DOCTYPE html>
<html lang="en-IE">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#061326" />
  <title>Olan's Star Launch</title>
  <style>
    :root {
      --target-stars: 10;
      --bg1: #030916;
      --bg2: #0b1f46;
      --bg3: #123d7c;
      --panel: rgba(255, 255, 255, 0.105);
      --panel2: rgba(255, 255, 255, 0.16);
      --line: rgba(255, 255, 255, 0.15);
      --text: #f8fbff;
      --soft: #c7d9f4;
      --gold: #ffd24d;
      --gold2: #fff1a8;
      --red: #e84b4b;
      --blue: #7ccfff;
      --metal: #d9e2ef;
      --darkMetal: #778397;
      --shadow: rgba(0, 0, 0, 0.32);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 8%, rgba(63, 133, 224, 0.5) 0%, rgba(10, 32, 73, 0.35) 30%, transparent 58%),
        linear-gradient(180deg, var(--bg3) 0%, var(--bg2) 36%, var(--bg1) 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    body {
      min-height: 100svh;
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
    }

    .app {
      width: 100%;
      max-width: 470px;
      margin: 0 auto;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .starfield {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.95;
    }

    .starfield span {
      position: absolute;
      background: rgba(255, 255, 255, 0.9);
      clip-path: polygon(50% 0%, 61% 36%, 98% 35%, 68% 57%, 79% 92%, 50% 70%, 21% 92%, 32% 57%, 2% 35%, 39% 36%);
      animation: twinkle 3.4s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.22; transform: scale(0.85) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(8deg); }
    }

    header {
      padding: 12px 6px 2px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 7vw, 2.55rem);
      letter-spacing: 0.03em;
      text-shadow: 0 3px 14px var(--shadow);
    }

    .welcome {
      margin: 7px auto 0;
      line-height: 1.25;
      font-size: clamp(0.98rem, 4.2vw, 1.18rem);
      color: var(--soft);
      max-width: 380px;
    }

    .sky-card {
      position: relative;
      z-index: 2;
      border-radius: 26px;
      background:
        radial-gradient(circle at 84% 16%, rgba(255, 224, 117, 0.18) 0 12%, transparent 13%),
        linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0.055));
      border: 1px solid var(--line);
      box-shadow: 0 14px 34px rgba(0,0,0,0.24);
      padding: 14px;
      overflow: hidden;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .progress-text {
      font-weight: 900;
      letter-spacing: 0.02em;
      font-size: 1rem;
      text-shadow: 0 2px 8px var(--shadow);
    }

    .rocket-name {
      font-size: 0.82rem;
      color: var(--soft);
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 6px 9px;
      white-space: nowrap;
    }

    .sky-stars {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: 48px;
      gap: 8px;
      padding: 4px 1px 2px;
      position: relative;
      z-index: 2;
    }

    .slot {
      border-radius: 17px;
      display: grid;
      place-items: center;
      font-size: clamp(1.55rem, 8vw, 2.25rem);
      background: rgba(0,0,0,0.15);
      border: 1px solid rgba(255,255,255,0.11);
      transform: rotate(var(--r)) translate(var(--tx), var(--ty));
      opacity: 0.94;
    }

    .slot::before {
      content: "";
      width: 62%;
      aspect-ratio: 1;
      background: rgba(255,255,255,0.06);
      clip-path: polygon(50% 0%, 61% 36%, 98% 35%, 68% 57%, 79% 92%, 50% 70%, 21% 92%, 32% 57%, 2% 35%, 39% 36%);
    }

    .slot.filled {
      background: radial-gradient(circle, rgba(255,236,139,0.18), rgba(255,210,77,0.045));
      border: 1px solid rgba(255,210,77,0.28);
      box-shadow: inset 0 0 22px rgba(255,210,77,0.1);
      animation: settle 0.45s ease both;
    }

    .slot.filled::before {
      background: linear-gradient(135deg, var(--gold2), var(--gold) 60%, #ffaf33);
      filter: drop-shadow(0 0 8px rgba(255, 210, 77, 0.75));
    }

    @keyframes settle {
      from { transform: rotate(var(--r)) translate(var(--tx), var(--ty)) scale(1.35); opacity: 0; }
      to { transform: rotate(var(--r)) translate(var(--tx), var(--ty)) scale(1); opacity: 1; }
    }

    .launch-card, .tickets-card, .history-card {
      position: relative;
      z-index: 2;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.2);
      backdrop-filter: blur(8px);
    }

    .launch-stage {
      height: min(56svh, 500px);
      min-height: 410px;
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        radial-gradient(circle at 50% 8%, rgba(123,201,255,0.2), transparent 28%),
        linear-gradient(180deg, rgba(4,12,34,0.1), rgba(255,255,255,0.045));
      background-size: 100% 28px, 28px 100%, auto, auto;
    }

    .altitude-line {
      position: absolute;
      left: 16px;
      top: 15px;
      bottom: 98px;
      width: 2px;
      background: linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0.04));
      opacity: 0.7;
    }

    .altitude-line::before,
    .altitude-line::after {
      content: "";
      position: absolute;
      left: -4px;
      width: 10px;
      height: 2px;
      background: rgba(255,255,255,0.28);
    }

    .altitude-line::before { top: 0; }
    .altitude-line::after { bottom: 0; }

    .rocket-wrap {
      position: absolute;
      left: 50%;
      bottom: 96px;
      width: 95px;
      height: 178px;
      transform: translateX(-50%);
      transform-origin: 50% 92%;
      transition: opacity 0.2s ease;
      z-index: 4;
    }

    .rocket-wrap.launch {
      animation: longLaunch 2.15s cubic-bezier(.25,.72,.28,1) forwards;
    }

    @keyframes longLaunch {
      0% { transform: translateX(-50%) translateY(0) rotate(0deg); }
      10% { transform: translateX(-50%) translateY(0) rotate(-1.5deg); }
      25% { transform: translateX(-50%) translateY(-58px) rotate(1.5deg); }
      72% { transform: translateX(-50%) translateY(calc(-1 * min(44svh, 390px))) rotate(0deg); opacity: 1; }
      100% { transform: translateX(-50%) translateY(calc(-1 * min(50svh, 450px))) rotate(0deg); opacity: 0; }
    }

    .rocket-svg {
      width: 95px;
      height: 178px;
      overflow: visible;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.26));
    }

    .rocket-flame {
      transform-origin: 50% 88%;
      animation: flamePulse 0.14s infinite alternate;
    }

    @keyframes flamePulse {
      from { transform: scaleY(0.78); opacity: 0.75; }
      to { transform: scaleY(1.16); opacity: 1; }
    }

    .pad {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 112px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.22)),
        linear-gradient(90deg, #28313d, #475364 45%, #28313d);
      border-top: 1px solid rgba(255,255,255,0.16);
      z-index: 5;
    }

    .gantry {
      position: absolute;
      left: calc(50% + 50px);
      bottom: 90px;
      width: 42px;
      height: 165px;
      opacity: 0.55;
      background:
        linear-gradient(115deg, transparent 0 45%, rgba(255,255,255,0.28) 46% 52%, transparent 53%),
        linear-gradient(65deg, transparent 0 45%, rgba(255,255,255,0.20) 46% 52%, transparent 53%),
        repeating-linear-gradient(180deg, rgba(255,255,255,0.2) 0 2px, transparent 2px 22px);
      border-left: 2px solid rgba(255,255,255,0.2);
      border-right: 2px solid rgba(255,255,255,0.2);
      z-index: 2;
    }

    .star-picker-panel {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      z-index: 8;
    }

    .prompt {
      margin: 0;
      color: var(--soft);
      font-size: 0.95rem;
      line-height: 1.15;
      text-align: center;
      font-weight: 700;
    }

    .star-picker {
      display: flex;
      justify-content: center;
      gap: clamp(6px, 2vw, 10px);
    }

    .pick-star {
      border: 1px solid rgba(255,255,255,0.13);
      background: rgba(0,0,0,0.16);
      color: rgba(255, 255, 255, 0.42);
      width: clamp(44px, 12vw, 56px);
      height: clamp(42px, 12vw, 54px);
      border-radius: 16px;
      font-size: clamp(1.35rem, 8vw, 2.05rem);
      display: grid;
      place-items: center;
      filter: drop-shadow(0 3px 3px rgba(0,0,0,0.25));
      transition: transform 0.12s ease, color 0.12s ease, background 0.12s ease;
    }

    .pick-star::before {
      content: "";
      width: 70%;
      aspect-ratio: 1;
      background: currentColor;
      clip-path: polygon(50% 0%, 61% 36%, 98% 35%, 68% 57%, 79% 92%, 50% 70%, 21% 92%, 32% 57%, 2% 35%, 39% 36%);
    }

    .pick-star.selected {
      color: var(--gold);
      transform: scale(1.07) rotate(-2deg);
      background: rgba(255,210,77,0.13);
      box-shadow: inset 0 0 18px rgba(255,210,77,0.08);
    }

    button.main {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 1.14rem;
      font-weight: 950;
      color: #14284c;
      background: linear-gradient(180deg, #fff8bd, var(--gold));
      box-shadow: 0 7px 0 #bc8414, 0 13px 22px rgba(0,0,0,0.24);
      transform: translateY(0);
    }

    button.main:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #bc8414, 0 8px 14px rgba(0,0,0,0.22);
    }

    button.main:disabled {
      opacity: 0.52;
      filter: grayscale(0.35);
    }

    .message {
      min-height: 34px;
      text-align: center;
      margin: 10px 0 0;
      color: var(--soft);
      font-weight: 750;
      line-height: 1.2;
    }

    .small-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .soft-button {
      flex: 1;
      border: 1px solid rgba(255,255,255,0.18);
      background: var(--panel2);
      color: var(--text);
      border-radius: 14px;
      padding: 10px;
      font-weight: 850;
      font-size: 0.93rem;
    }

    .launch-star {
      position: absolute;
      z-index: 12;
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--gold2), var(--gold) 55%, #ffa62f);
      clip-path: polygon(50% 0%, 61% 36%, 98% 35%, 68% 57%, 79% 92%, 50% 70%, 21% 92%, 32% 57%, 2% 35%, 39% 36%);
      filter: drop-shadow(0 0 9px rgba(255,210,77,0.85));
      animation: starLoad 0.86s ease-in forwards;
    }

    @keyframes starLoad {
      0% { transform: translate(0, 0) scale(1.1) rotate(0); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.28) rotate(260deg); opacity: 0; }
    }

    .burst-star {
      position: absolute;
      z-index: 15;
      width: var(--s);
      height: var(--s);
      background: linear-gradient(135deg, var(--gold2), var(--gold), #ff9e2b);
      clip-path: polygon(50% 0%, 61% 36%, 98% 35%, 68% 57%, 79% 92%, 50% 70%, 21% 92%, 32% 57%, 2% 35%, 39% 36%);
      filter: drop-shadow(0 0 10px rgba(255,210,77,0.88));
      animation: burst 1.1s ease-out forwards;
    }

    @keyframes burst {
      0% { transform: translate(0, 0) scale(0.25) rotate(0); opacity: 1; }
      72% { opacity: 1; }
      100% { transform: translate(var(--bx), var(--by)) scale(1) rotate(var(--rot)); opacity: 0; }
    }

    .tickets-card h2, .history-card h2 {
      font-size: 1.12rem;
      margin: 0 0 8px;
    }

    .ticket-list, .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ticket, .history-item {
      border-radius: 14px;
      background: rgba(255,255,255,0.095);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.92rem;
      line-height: 1.15;
    }

    .ticket button {
      border: 0;
      border-radius: 10px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.18);
      color: white;
      font-weight: 850;
      flex: 0 0 auto;
    }

    details {
      margin-bottom: 18px;
      position: relative;
      z-index: 2;
    }

    summary {
      text-align: center;
      color: rgba(255,255,255,0.72);
      padding: 8px;
      font-size: 0.9rem;
    }

    .danger {
      background: rgba(255, 92, 92, 0.22) !important;
    }

    .hidden {
      display: none !important;
    }

    .jar-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      background: rgba(2, 8, 28, 0.78);
      backdrop-filter: blur(7px);
      padding: 22px;
    }

    .jar-overlay.show {
      display: grid;
    }

    .jar-card {
      width: min(392px, 100%);
      border-radius: 30px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,210,77,0.12), transparent 35%),
        linear-gradient(180deg, #273f7a, #10224e);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 24px 74px rgba(0,0,0,0.48);
      padding: 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .jar-title {
      font-size: 1.75rem;
      font-weight: 950;
      margin: 0 0 6px;
    }

    .jar-subtitle {
      color: var(--soft);
      margin: 0 0 14px;
      line-height: 1.25;
    }

    .treat-jar {
      width: 176px;
      height: 170px;
      margin: 6px auto 14px;
      position: relative;
      overflow: visible;
    }

    .lid {
      position: absolute;
      left: 37px;
      top: 8px;
      width: 102px;
      height: 25px;
      background: #ffd36e;
      border-radius: 16px 16px 8px 8px;
      box-shadow: 0 5px 0 #bd7f1c;
      transform-origin: 15% 100%;
      transition: transform 0.42s ease;
      z-index: 7;
    }

    .lid.open {
      transform: translateY(-20px) rotate(-25deg);
    }

    .jar-glass {
      position: absolute;
      left: 25px;
      top: 32px;
      width: 126px;
      height: 124px;
      border-radius: 21px 21px 39px 39px;
      background: linear-gradient(90deg, rgba(255,255,255,0.28), rgba(125,210,255,0.20), rgba(255,255,255,0.12));
      border: 3px solid rgba(227,247,255,0.75);
      box-shadow: inset 0 0 18px rgba(255,255,255,0.16);
      z-index: 3;
    }

    .jar-sweets {
      position: absolute;
      left: 42px;
      bottom: 22px;
      width: 94px;
      height: 58px;
      background:
        radial-gradient(circle at 18px 20px, #ff7a7a 0 10px, transparent 11px),
        radial-gradient(circle at 46px 14px, #80ffb1 0 10px, transparent 11px),
        radial-gradient(circle at 70px 31px, #ffe36d 0 10px, transparent 11px),
        radial-gradient(circle at 32px 42px, #8cc9ff 0 10px, transparent 11px);
      z-index: 4;
    }

    .scroll-roll {
      position: absolute;
      left: 50%;
      top: 82px;
      width: 98px;
      height: 32px;
      transform: translateX(-50%) scaleX(0.35);
      border-radius: 999px;
      background: #fff0bf;
      box-shadow: inset 0 0 0 2px #d7b15e, 0 8px 14px rgba(0,0,0,0.25);
      opacity: 0;
      z-index: 6;
    }

    .scroll-roll.fly {
      animation: scrollFly 0.72s ease-out forwards;
    }

    @keyframes scrollFly {
      0% { transform: translateX(-50%) translateY(0) scaleX(0.35); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateX(-50%) translateY(-82px) scaleX(1); opacity: 1; }
    }

    .scroll {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.72s ease;
    }

    .scroll.show {
      max-height: 260px;
    }

    .scroll-paper {
      margin: 8px auto 12px;
      background:
        linear-gradient(90deg, rgba(115,72,24,0.12), transparent 9%, transparent 91%, rgba(115,72,24,0.12)),
        #fff0bf;
      color: #4b2b11;
      border-radius: 14px;
      padding: 16px 14px;
      box-shadow: inset 0 0 0 2px #dfb965, 0 8px 18px rgba(0,0,0,0.22);
      font-weight: 850;
      line-height: 1.2;
      transform-origin: 50% 0%;
      animation: unroll 0.55s ease both;
    }

    @keyframes unroll {
      from { transform: scaleY(0.08); opacity: 0.1; }
      to { transform: scaleY(1); opacity: 1; }
    }

    .tier {
      display: inline-block;
      margin-bottom: 8px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 0.82rem;
      color: #17325f;
      background: #fff;
    }

    @media (max-height: 720px) {
      .launch-stage {
        min-height: 370px;
        height: 52svh;
      }

      .rocket-wrap {
        width: 82px;
        height: 154px;
        bottom: 94px;
      }

      .rocket-svg {
        width: 82px;
        height: 154px;
      }

      .sky-stars {
        grid-auto-rows: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="starfield" aria-hidden="true" id="starfield"></div>

  <main class="app">
    <header>
      <h1>Hi Olan</h1>
      <p class="welcome" id="welcomeText">Mission control is ready.</p>
    </header>

    <section class="sky-card" aria-label="Olan's star sky">
      <div class="progress-row">
        <div class="progress-text" id="progressText">0 of 10 launch stars</div>
        <div class="rocket-name" id="rocketName">Today’s rocket</div>
      </div>
      <div class="sky-stars" id="skyStars"></div>
    </section>

    <section class="launch-card">
      <div class="launch-stage" id="launchStage">
        <div class="altitude-line" aria-hidden="true"></div>
        <div class="gantry" aria-hidden="true"></div>

        <div class="rocket-wrap" id="rocketWrap" aria-hidden="true">
          <svg class="rocket-svg" id="rocketSvg" viewBox="0 0 95 178" role="img" aria-label="Rocket"></svg>
        </div>

        <div class="pad"></div>

        <div class="star-picker-panel">
          <p class="prompt">Tap today’s school stars, then launch.</p>
          <div class="star-picker" aria-label="Choose today's stars">
            <button class="pick-star" data-value="1" aria-label="1 star"></button>
            <button class="pick-star" data-value="2" aria-label="2 stars"></button>
            <button class="pick-star" data-value="3" aria-label="3 stars"></button>
            <button class="pick-star" data-value="4" aria-label="4 stars"></button>
            <button class="pick-star" data-value="5" aria-label="5 stars"></button>
          </div>
        </div>
      </div>

      <button class="main" id="launchButton" disabled>Launch Stars</button>
      <p class="message" id="messageText">Choose 1 to 5 stars, then launch the rocket.</p>

      <div class="small-row">
        <button class="soft-button" id="undoButton">Undo last launch</button>
        <button class="soft-button" id="newGreetingButton">New greeting</button>
      </div>
    </section>

    <section class="tickets-card hidden" id="ticketsCard">
      <h2>Prize Tickets</h2>
      <div class="ticket-list" id="ticketList"></div>
    </section>

    <details>
      <summary>Parent tools</summary>
      <section class="history-card">
        <h2>Recent launches</h2>
        <div class="history-list" id="historyList"></div>
        <div class="small-row">
          <button class="soft-button" id="subtractButton">Remove 1 star</button>
          <button class="soft-button danger" id="resetButton">Reset app</button>
        </div>
      </section>
    </details>
  </main>

  <div class="jar-overlay" id="jarOverlay" role="dialog" aria-modal="true" aria-label="Prize jar">
    <div class="jar-card">
      <p class="jar-title">Prize Jar</p>
      <p class="jar-subtitle">Ten stars launched. Tap the lid to release Olan’s prize.</p>

      <div class="treat-jar" id="treatJar">
        <div class="lid" id="jarLid"></div>
        <div class="scroll-roll" id="scrollRoll"></div>
        <div class="jar-glass"></div>
        <div class="jar-sweets"></div>
      </div>

      <button class="main" id="openJarButton">Open the Jar</button>

      <div class="scroll" id="scroll">
        <div class="scroll-paper">
          <span class="tier" id="prizeTier">Prize</span>
          <div id="prizeText">Prize text</div>
        </div>
        <button class="soft-button" id="closeJarButton">Save Prize Ticket</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "olan-star-rocket-v1";
    const TARGET_STARS = 10;

    const welcomes = [
      "How was school today? Mission control is ready.",
      "Ready to launch today’s school stars?",
      "Olan’s rocket is fuelled and standing by.",
      "Another school day complete. Launch window is open.",
      "Let’s see how far today’s stars can go.",
      "Star mission ready. How did today go?",
      "Rocket systems online. Time to launch.",
      "Great work getting through school today. Launch sequence ready."
    ];

    const afterLaunchMessages = [
      "Launch successful. Those stars are locked into orbit.",
      "Great work, Olan. Mission complete for today.",
      "Stars safely delivered. Next launch tomorrow.",
      "Excellent launch. The sky is filling up.",
      "Good work today. Keep building towards the prize jar.",
      "Star launch complete. Mission control is impressed."
    ];

    const rocketVariants = [
      {
        name: "Saturn-style heavy rocket",
        svg: `
          <defs>
            <linearGradient id="bodySaturn" x1="0" x2="1">
              <stop offset="0" stop-color="#eef3f8"/><stop offset="0.55" stop-color="#ffffff"/><stop offset="1" stop-color="#b8c4d4"/>
            </linearGradient>
          </defs>
          <path d="M47.5 4 L66 35 L62 135 L33 135 L29 35 Z" fill="url(#bodySaturn)" stroke="#6f7c8d" stroke-width="2"/>
          <rect x="31" y="42" width="33" height="18" fill="#171d2b"/>
          <rect x="31" y="85" width="33" height="8" fill="#171d2b"/>
          <rect x="37" y="136" width="21" height="16" fill="#697487"/>
          <path d="M33 118 L10 152 L33 143 Z" fill="#2b3342"/>
          <path d="M62 118 L85 152 L62 143 Z" fill="#2b3342"/>
          <path class="rocket-flame" d="M36 151 Q47.5 178 59 151 Q47.5 160 36 151" fill="#ff5a36"/>
          <path class="rocket-flame" d="M41 151 Q47.5 169 54 151 Q47.5 158 41 151" fill="#ffd15c"/>
        `
      },
      {
        name: "Starship-style silver rocket",
        svg: `
          <defs>
            <linearGradient id="bodyStarship" x1="0" x2="1">
              <stop offset="0" stop-color="#8d98a6"/><stop offset="0.35" stop-color="#e9edf2"/><stop offset="0.7" stop-color="#ffffff"/><stop offset="1" stop-color="#737f91"/>
            </linearGradient>
          </defs>
          <path d="M47.5 5 C62 24 67 45 66 76 L63 139 L32 139 L29 76 C28 45 33 24 47.5 5Z" fill="url(#bodyStarship)" stroke="#657083" stroke-width="2"/>
          <circle cx="47.5" cy="48" r="9" fill="#1b2e47" stroke="#aeb8c7" stroke-width="3"/>
          <path d="M33 112 L13 150 L34 140 Z" fill="#424b5a"/>
          <path d="M62 112 L82 150 L61 140 Z" fill="#424b5a"/>
          <rect x="38" y="139" width="19" height="13" fill="#404958"/>
          <path class="rocket-flame" d="M36 151 Q47.5 177 59 151 Q47.5 161 36 151" fill="#ff5a36"/>
          <path class="rocket-flame" d="M41 151 Q47.5 168 54 151 Q47.5 158 41 151" fill="#ffd15c"/>
        `
      },
      {
        name: "Falcon-style booster",
        svg: `
          <defs>
            <linearGradient id="bodyFalcon" x1="0" x2="1">
              <stop offset="0" stop-color="#d7dde6"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#aeb8c6"/>
            </linearGradient>
          </defs>
          <path d="M47.5 6 C59 24 62 41 61 64 L59 143 L36 143 L34 64 C33 41 36 24 47.5 6Z" fill="url(#bodyFalcon)" stroke="#687486" stroke-width="2"/>
          <rect x="37" y="51" width="21" height="5" fill="#222b39"/>
          <rect x="38" y="83" width="19" height="5" fill="#222b39"/>
          <path d="M36 121 L18 151 L36 143 Z" fill="#596374"/>
          <path d="M59 121 L77 151 L59 143 Z" fill="#596374"/>
          <rect x="39" y="143" width="17" height="10" fill="#4c5666"/>
          <path class="rocket-flame" d="M36 151 Q47.5 176 59 151 Q47.5 161 36 151" fill="#ff5a36"/>
          <path class="rocket-flame" d="M41 151 Q47.5 168 54 151 Q47.5 158 41 151" fill="#ffd15c"/>
        `
      },
      {
        name: "Blue science rocket",
        svg: `
          <defs>
            <linearGradient id="bodyBlue" x1="0" x2="1">
              <stop offset="0" stop-color="#a7d8ff"/><stop offset="0.55" stop-color="#f7fbff"/><stop offset="1" stop-color="#5998d2"/>
            </linearGradient>
          </defs>
          <path d="M47.5 3 L66 38 L63 136 L32 136 L29 38 Z" fill="url(#bodyBlue)" stroke="#446b93" stroke-width="2"/>
          <path d="M47.5 3 L66 38 L29 38 Z" fill="#1e6fb8"/>
          <circle cx="47.5" cy="61" r="10" fill="#102c50" stroke="#cce9ff" stroke-width="3"/>
          <rect x="35" y="91" width="25" height="7" fill="#1e6fb8"/>
          <path d="M32 118 L12 153 L33 143 Z" fill="#1e6fb8"/>
          <path d="M63 118 L83 153 L62 143 Z" fill="#1e6fb8"/>
          <path class="rocket-flame" d="M36 151 Q47.5 178 59 151 Q47.5 161 36 151" fill="#ff5a36"/>
          <path class="rocket-flame" d="M41 151 Q47.5 168 54 151 Q47.5 158 41 151" fill="#ffd15c"/>
        `
      },
      {
        name: "Red lunar rocket",
        svg: `
          <defs>
            <linearGradient id="bodyRed" x1="0" x2="1">
              <stop offset="0" stop-color="#d6dbe5"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#b6bfce"/>
            </linearGradient>
          </defs>
          <path d="M47.5 5 L64 35 L62 137 L33 137 L31 35 Z" fill="url(#bodyRed)" stroke="#6d7889" stroke-width="2"/>
          <path d="M47.5 5 L64 35 L31 35 Z" fill="#d64545"/>
          <rect x="33" y="72" width="29" height="9" fill="#d64545"/>
          <circle cx="47.5" cy="53" r="9" fill="#14233d" stroke="#eef3f8" stroke-width="3"/>
          <path d="M33 116 L10 153 L34 142 Z" fill="#d64545"/>
          <path d="M62 116 L85 153 L61 142 Z" fill="#d64545"/>
          <path class="rocket-flame" d="M36 151 Q47.5 178 59 151 Q47.5 161 36 151" fill="#ff5a36"/>
          <path class="rocket-flame" d="M41 151 Q47.5 168 54 151 Q47.5 158 41 151" fill="#ffd15c"/>
        `
      },
      {
        name: "Probe launcher",
        svg: `
          <defs>
            <linearGradient id="bodyProbe" x1="0" x2="1">
              <stop offset="0" stop-color="#b9c6d8"/><stop offset="0.45" stop-color="#f8fbff"/><stop offset="1" stop-color="#8795aa"/>
            </linearGradient>
          </defs>
          <path d="M47.5 7 C58 23 63 42 63 69 L60 134 L35 134 L32 69 C32 42 37 23 47.5 7Z" fill="url(#bodyProbe)" stroke="#5e6b7e" stroke-width="2"/>
          <rect x="31" y="82" width="33" height="12" rx="3" fill="#253047"/>
          <circle cx="47.5" cy="53" r="8" fill="#263a5b" stroke="#dbe9ff" stroke-width="3"/>
          <path d="M35 116 L17 151 L36 141 Z" fill="#f0b23c"/>
          <path d="M60 116 L78 151 L59 141 Z" fill="#f0b23c"/>
          <rect x="40" y="134" width="15" height="18" fill="#566276"/>
          <path class="rocket-flame" d="M36 151 Q47.5 178 59 151 Q47.5 161 36 151" fill="#ff5a36"/>
          <path class="rocket-flame" d="M41 151 Q47.5 168 54 151 Q47.5 158 41 151" fill="#ffd15c"/>
        `
      }
    ];

    const prizeTiers = [
      {
        name: "Rocket Prize",
        weight: 60,
        prizes: [
          "30 minutes extra PlayStation time",
          "30 minutes extra tablet time",
          "Hot chocolate",
          "Double dessert tonight",
          "Trip to the shop to buy sweets",
          "Choose a film or programme tonight",
          "Stay up 15 minutes later",
          "Pick dinner one evening"
        ]
      },
      {
        name: "Rare Rocket Prize",
        weight: 25,
        prizes: [
          "45 minutes extra PlayStation time",
          "45 minutes extra tablet time",
          "Trip to McDonald’s",
          "Swimming pool trip",
          "Choose a family activity",
          "New small magazine, comic or book",
          "Special dessert from the shop"
        ]
      },
      {
        name: "Super Rare Prize",
        weight: 12,
        prizes: [
          "1 hour extra PlayStation time",
          "1 hour extra tablet time",
          "Trip to Smyths Toys Superstore",
          "Cinema trip",
          "New small toy",
          "Pick a weekend activity"
        ]
      },
      {
        name: "Legendary Prize",
        weight: 3,
        prizes: [
          "Big Smyths trip",
          "Swimming pool plus treat afterwards",
          "McDonald’s plus playground or activity",
          "Special day out with Mam or Dad",
          "Choose a bigger reward from the parent-approved list"
        ]
      }
    ];

    const defaultState = {
      stars: 0,
      selected: 0,
      tickets: [],
      history: [],
      lastLaunch: null
    };

    let state = loadState();
    let pendingPrize = null;
    let isAnimating = false;

    const skyStars = document.getElementById("skyStars");
    const progressText = document.getElementById("progressText");
    const rocketName = document.getElementById("rocketName");
    const welcomeText = document.getElementById("welcomeText");
    const pickerButtons = [...document.querySelectorAll(".pick-star")];
    const launchButton = document.getElementById("launchButton");
    const messageText = document.getElementById("messageText");
    const launchStage = document.getElementById("launchStage");
    const rocketWrap = document.getElementById("rocketWrap");
    const rocketSvg = document.getElementById("rocketSvg");
    const undoButton = document.getElementById("undoButton");
    const newGreetingButton = document.getElementById("newGreetingButton");
    const ticketsCard = document.getElementById("ticketsCard");
    const ticketList = document.getElementById("ticketList");
    const historyList = document.getElementById("historyList");
    const resetButton = document.getElementById("resetButton");
    const subtractButton = document.getElementById("subtractButton");
    const jarOverlay = document.getElementById("jarOverlay");
    const openJarButton = document.getElementById("openJarButton");
    const jarLid = document.getElementById("jarLid");
    const scrollRoll = document.getElementById("scrollRoll");
    const scroll = document.getElementById("scroll");
    const prizeTier = document.getElementById("prizeTier");
    const prizeText = document.getElementById("prizeText");
    const closeJarButton = document.getElementById("closeJarButton");

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? { ...defaultState, ...JSON.parse(raw) } : { ...defaultState };
      } catch {
        return { ...defaultState };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function setRandomGreeting() {
      welcomeText.textContent = randomItem(welcomes);
    }

    function dayIndex() {
      const today = new Date();
      const key = today.getFullYear() * 372 + (today.getMonth() + 1) * 31 + today.getDate();
      return key % rocketVariants.length;
    }

    function setTodaysRocket() {
      const rocket = rocketVariants[dayIndex()];
      rocketSvg.innerHTML = rocket.svg;
      rocketName.textContent = rocket.name;
    }

    function drawStarfield() {
      const wrap = document.getElementById("starfield");
      wrap.innerHTML = "";
      for (let i = 0; i < 90; i++) {
        const s = document.createElement("span");
        const size = 2 + Math.random() * 3.5;
        s.style.width = size + "px";
        s.style.height = size + "px";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 100 + "%";
        s.style.animationDelay = (Math.random() * 3.5) + "s";
        s.style.opacity = 0.22 + Math.random() * 0.78;
        wrap.appendChild(s);
      }
    }

    function render() {
      state.stars = Math.max(0, Math.min(TARGET_STARS - 1, Number(state.stars) || 0));
      progressText.textContent = `${state.stars} of ${TARGET_STARS} launch stars`;

      skyStars.innerHTML = "";
      const offsets = [
        [-6, -1, 0], [4, 2, -2], [-3, -2, 1], [7, 2, 0], [-5, -1, -1],
        [5, 1, 1], [-7, -2, 0], [3, 2, -1], [-4, -1, 2], [6, 1, 0]
      ];

      for (let i = 1; i <= TARGET_STARS; i++) {
        const slot = document.createElement("div");
        const [rot, tx, ty] = offsets[i-1];
        slot.className = "slot" + (i <= state.stars ? " filled" : "");
        slot.style.setProperty("--r", `${rot}deg`);
        slot.style.setProperty("--tx", `${tx}px`);
        slot.style.setProperty("--ty", `${ty}px`);
        skyStars.appendChild(slot);
      }

      pickerButtons.forEach(btn => {
        const value = Number(btn.dataset.value);
        btn.classList.toggle("selected", value <= state.selected);
      });

      launchButton.disabled = state.selected < 1 || state.selected > 5 || isAnimating;

      renderTickets();
      renderHistory();
      saveState();
    }

    function renderTickets() {
      ticketList.innerHTML = "";
      ticketsCard.classList.toggle("hidden", state.tickets.length === 0);

      state.tickets.forEach(ticket => {
        const row = document.createElement("div");
        row.className = "ticket";
        const label = document.createElement("div");
        label.innerHTML = `<strong>${escapeHtml(ticket.tier)}</strong><br>${escapeHtml(ticket.prize)}`;
        const button = document.createElement("button");
        button.textContent = "Claimed";
        button.addEventListener("click", () => {
          state.tickets = state.tickets.filter(t => t.id !== ticket.id);
          render();
        });
        row.appendChild(label);
        row.appendChild(button);
        ticketList.appendChild(row);
      });
    }

    function renderHistory() {
      historyList.innerHTML = "";
      const items = state.history.slice(0, 6);
      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "history-item";
        empty.textContent = "No launches yet.";
        historyList.appendChild(empty);
        return;
      }

      items.forEach(item => {
        const row = document.createElement("div");
        row.className = "history-item";
        const prizePart = item.prize ? ` Prize: ${item.prize}.` : "";
        row.textContent = `${item.date}: launched ${item.added} star${item.added === 1 ? "" : "s"}.${prizePart}`;
        historyList.appendChild(row);
      });
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function chooseStars(value) {
      if (isAnimating) return;
      state.selected = value;
      messageText.textContent = `${value} star${value === 1 ? "" : "s"} selected. Ready to launch.`;
      render();
    }

    function launchStars() {
      if (isAnimating || state.selected < 1) return;
      isAnimating = true;
      launchButton.disabled = true;

      const added = state.selected;
      animateStarsIntoRocket(added);

      setTimeout(() => {
        rocketWrap.classList.add("launch");
      }, 650);

      setTimeout(() => {
        animateTopBurst();

        const before = state.stars;
        let total = before + added;
        const wonPrize = total >= TARGET_STARS;
        if (wonPrize) {
          total -= TARGET_STARS;
          pendingPrize = choosePrize();
        }

        state.stars = total;
        state.lastLaunch = { before, added, prize: pendingPrize };
        const historyItem = {
          date: new Date().toLocaleDateString("en-IE", { weekday: "short", day: "numeric", month: "short" }),
          added,
          prize: pendingPrize ? pendingPrize.prize : ""
        };
        state.history.unshift(historyItem);
        state.history = state.history.slice(0, 20);
        state.selected = 0;

        messageText.textContent = wonPrize
          ? "Ten stars launched. Prize jar unlocked."
          : randomItem(afterLaunchMessages);

        render();
      }, 2050);

      setTimeout(() => {
        rocketWrap.classList.remove("launch");
        isAnimating = false;
        render();

        if (pendingPrize) {
          showPrizeJar(pendingPrize);
        }
      }, 2550);
    }

    function animateStarsIntoRocket(count) {
      const rect = launchStage.getBoundingClientRect();
      const rocketTargetX = rect.width / 2;
      const rocketTargetY = rect.height - 130;

      for (let i = 0; i < count; i++) {
        const s = document.createElement("div");
        s.className = "launch-star";
        const startX = rect.width * (0.22 + i * (0.56 / Math.max(1, count - 1 || 1)));
        const startY = rect.height - 62 + (i % 2) * 3;
        s.style.left = `${startX}px`;
        s.style.top = `${startY}px`;
        s.style.setProperty("--dx", `${rocketTargetX - startX - 14}px`);
        s.style.setProperty("--dy", `${rocketTargetY - startY}px`);
        s.style.animationDelay = `${i * 0.075}s`;
        launchStage.appendChild(s);
        setTimeout(() => s.remove(), 1150);
      }
    }

    function animateTopBurst() {
      const centreX = launchStage.clientWidth / 2;
      const centreY = 38;
      for (let i = 0; i < 26; i++) {
        const s = document.createElement("div");
        s.className = "burst-star";
        const size = 11 + Math.random() * 16;
        s.style.setProperty("--s", `${size}px`);
        s.style.left = `${centreX}px`;
        s.style.top = `${centreY}px`;
        const angle = (Math.PI * 2 * i) / 26;
        const distance = 34 + Math.random() * 95;
        s.style.setProperty("--bx", `${Math.cos(angle) * distance}px`);
        s.style.setProperty("--by", `${Math.sin(angle) * distance}px`);
        s.style.setProperty("--rot", `${Math.floor(Math.random() * 220) - 110}deg`);
        launchStage.appendChild(s);
        setTimeout(() => s.remove(), 1250);
      }
    }

    function choosePrize() {
      const totalWeight = prizeTiers.reduce((sum, tier) => sum + tier.weight, 0);
      let roll = Math.random() * totalWeight;
      let chosenTier = prizeTiers[0];

      for (const tier of prizeTiers) {
        roll -= tier.weight;
        if (roll <= 0) {
          chosenTier = tier;
          break;
        }
      }

      return {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        tier: chosenTier.name,
        prize: randomItem(chosenTier.prizes),
        created: new Date().toISOString()
      };
    }

    function showPrizeJar(prize) {
      jarOverlay.classList.add("show");
      jarLid.classList.remove("open");
      scrollRoll.classList.remove("fly");
      scroll.classList.remove("show");
      openJarButton.classList.remove("hidden");
      prizeTier.textContent = prize.tier;
      prizeText.textContent = prize.prize;
    }

    function closePrizeJar() {
      if (pendingPrize) {
        state.tickets.unshift(pendingPrize);
        pendingPrize = null;
      }
      jarOverlay.classList.remove("show");
      jarLid.classList.remove("open");
      scrollRoll.classList.remove("fly");
      scroll.classList.remove("show");
      render();
    }

    function undoLastLaunch() {
      if (!state.lastLaunch || isAnimating) {
        messageText.textContent = "No launch to undo.";
        return;
      }

      state.stars = state.lastLaunch.before;
      state.history.shift();
      state.lastLaunch = null;
      messageText.textContent = "Last launch undone.";
      render();
    }

    function resetApp() {
      const ok = confirm("Reset all stars, prize tickets and history?");
      if (!ok) return;
      state = { ...defaultState, tickets: [], history: [], lastLaunch: null };
      pendingPrize = null;
      messageText.textContent = "App reset.";
      render();
    }

    pickerButtons.forEach(btn => {
      btn.addEventListener("click", () => chooseStars(Number(btn.dataset.value)));
    });

    launchButton.addEventListener("click", launchStars);
    undoButton.addEventListener("click", undoLastLaunch);
    newGreetingButton.addEventListener("click", setRandomGreeting);

    openJarButton.addEventListener("click", () => {
      jarLid.classList.add("open");
      openJarButton.classList.add("hidden");
      setTimeout(() => scrollRoll.classList.add("fly"), 260);
      setTimeout(() => scroll.classList.add("show"), 980);
    });

    closeJarButton.addEventListener("click", closePrizeJar);

    subtractButton.addEventListener("click", () => {
      state.stars = Math.max(0, state.stars - 1);
      state.lastLaunch = null;
      messageText.textContent = "One star removed.";
      render();
    });

    resetButton.addEventListener("click", resetApp);

    drawStarfield();
    setRandomGreeting();
    setTodaysRocket();
    render();
  </script>
</body>
</html>
